[project]
name = "unittrace"
version = "1.0.0"
description = "Reproducible full-census analysis pipeline for UnitTrace"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "rpmfile>=2.1.0",
  "zstandard>=0.23.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[project.scripts]
unittrace = "unittrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unittrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
